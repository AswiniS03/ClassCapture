<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Transcription and Summarization</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="#">MyApp</a>
            </div>
            <ul class="nav-menu">
                <li><a href="{{ url_for('home') }}">Home</a></li>
                <li><a href="{{ url_for('login') }}">Login</a></li>
                <li><a href="{{ url_for('signup') }}">Sign Up</a></li>
                <li><a href="{{ url_for('index') }}">Audio Notes</a></li>
                <li><a href="{{ url_for('video') }}">Video Notes</a></li>
                <li><a href="{{ url_for('profile') }}">Profile</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <h1>Audio Transcription and Summarization</h1>
        <form id="upload-form" enctype="multipart/form-data">
            <input type="file" id="file-input" name="file" accept="audio/*" required>
            <button type="submit">Upload and Process</button>
        </form>

        <div class="output-section">
            <h2>Transcript:</h2>
            <div id="transcript" class="output-box"></div>

            <h2>Summary:</h2>
            <div id="summary" class="output-box"></div>
            <button id="generate-pdf">Download PDF</button>
            <button id="generate-doc">Download Word Document</button>
        </div>

        <div class="loader hidden"></div>

        

        
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
